name: Actualizar imagen satelital SENAMHI

on:
  schedule:
    # Ejecuta cada hora, en el minuto 7 UTC
    - cron: "7 * * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar-imagen:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Descargar última imagen SENAMHI
        run: |
          python scripts/descargar_senamhi.py

      - name: Confirmar cambios en GitHub
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add data/latest.jpg data/metadata.csv

          git diff --cached --quiet || git commit -m "Actualizar imagen satelital SENAMHI"
          git push
